name: Sincronizar Instagram e Google

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 min
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync_instagram.py
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          ZIG_TOKEN: ${{ secrets.ZIG_TOKEN }}
          ZIG_LOJA: ${{ secrets.ZIG_LOJA }}
          ZIG_MENU: ${{ vars.ZIG_MENU }}
      - run: python scripts/sync_google.py
        continue-on-error: true
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      - run: |
          git config user.name "bosque-bot"
          git config user.email "bot@bosqueestradaparque.com.br"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza agenda do Instagram"
          # tenta salvar até 4 vezes: o GitHub às vezes falha (erro 503) ou outro robô salvou antes
          for i in 1 2 3 4; do git pull --rebase -q -X theirs && git push -q && exit 0; sleep $((i*10)); done
          exit 1
